  ]
};

const surfaceValues = geojsonData.features.map(f => f.properties['surface temp (max)']);
const valMin = Math.min(...surfaceValues);
const valMax = Math.max(...surfaceValues);

const colorStops = [
  { pos: 0, r: 26, g: 150, b: 65 },
  { pos: 0.25, r: 166, g: 217, b: 106 },
  { pos: 0.5, r: 255, g: 255, b: 191 },
  { pos: 0.75, r: 253, g: 174, b: 97 },
  { pos: 1, r: 215, g: 25, b: 28 }
];

function getColor(value) {
  const t = (value - valMin) / (valMax - valMin);
  for (let i = 0; i < colorStops.length - 1; i++) {
    if (t >= colorStops[i].pos && t <= colorStops[i + 1].pos) {
      const local = (t - colorStops[i].pos) / (colorStops[i + 1].pos - colorStops[i].pos);
      const r = Math.round(colorStops[i].r + (colorStops[i + 1].r - colorStops[i].r) * local);
      const g = Math.round(colorStops[i].g + (colorStops[i + 1].g - colorStops[i].g) * local);
      const b = Math.round(colorStops[i].b + (colorStops[i + 1].b - colorStops[i].b) * local);
      return `rgb(${r},${g},${b})`;
    }
  }
  return 'rgb(215,25,28)';
}

const map = L.map('map').setView([48.858, 2.345], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

L.geoJSON(geojsonData, {
  style: { color: '#fff', weight: 12, opacity: 0.8 }
}).addTo(map);

const geoLayer = L.geoJSON(geojsonData, {
  style: (feature) => ({
    color: getColor(feature.properties['surface temp (max)']),
    weight: 5,
    opacity: 1
  }),
  onEachFeature: (feature, layer) => {
    const props = feature.properties;
    const rows = Object.entries(props)
      .filter(([k]) => k !== 'id')
      .map(([k, v]) => `<tr><td style="font-weight:600;padding-right:8px">${k}</td><td>${v}</td></tr>`)
      .join('');
    layer.bindTooltip(`<table>${rows}</table>`, { sticky: true });
  }
}).addTo(map);

map.fitBounds(geoLayer.getBounds().pad(0.05));

const legendDiv = document.getElementById('legend');
legendDiv.innerHTML = '<div style="font-weight:700;margin-bottom:4px">Surface Temp (°C)</div>';
const steps = 6;
for (let i = 0; i < steps; i++) {
  const val = valMin + (valMax - valMin) * (i / (steps - 1));
  const color = getColor(val);
  legendDiv.innerHTML += `<div style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:18px;height:12px;background:${color};border-radius:2px"></span>${val.toFixed(1)}</div>`;
}
</script>

</html>
